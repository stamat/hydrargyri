name: CI

on:
  push:
    branches:
      - main
  pull_request:

# This workflow only reads the repository; say so, and the token can do no more.
permissions:
  contents: read

# A new push to the same branch or pull request supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The only language-specific step — everything below it calls script/*.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: script/bootstrap

      - name: Lint
        run: script/lint

      - name: Test
        run: script/test

      - name: Build
        run: script/build

      # The package ships dist/, and the docs site is what pages.yml deploys —
      # poops exits 0 when it has nothing to compile, so check the output rather
      # than the exit code.
      - name: Verify build output
        shell: bash
        run: |
          test -s dist/hydrargyri.mjs
          test -s dist/hydrargyri.min.mjs
          test -s dist/hydrargyri-demos.min.js
          # Every preview's js fence calls a bare `hg(...)`, so the bundle
          # losing the global is a page of ReferenceErrors and a green build.
          grep -q 'window.hg=' dist/hydrargyri-demos.min.js
          # hydrargyri-each's peer pulls the published hydrargyri into node_modules,
          # so a lost alias bundles two copies — which share no element registry
          # and no reactive subscribers, and cost the hg-each previews their
          # binds and repaints without failing anything.
          test "$(grep -c -o 'has no attribute or property' dist/hydrargyri-demos.min.js)" -eq 1
          test -s _site/index.html
          test -s _site/llms.txt

  # hydrargyri-each is built on six of HgElement's underscore members —
  # _wireHandlers, _scope, _scanBinds, _render, _handle and _listeners — and its
  # own CI installs the published hydrargyri. So a refactor of any of them goes
  # green in both repos and surfaces at the next publish, in someone else's
  # install. This job runs its suite against the working tree instead, which puts
  # the break on the pull request that causes it.
  downstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: script/bootstrap

      # A tarball rather than a path install: prepack builds dist/, the package
      # entry is src/scripts/hydrargyri.js, and `files` decides what ships — so
      # this resolves exactly as a publish would, and a file left out of `files`
      # fails here rather than after the tag.
      - name: Pack the working tree
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Check out hydrargyri-each
        uses: actions/checkout@v7
        with:
          repository: stamat/hydrargyri-each
          path: hydrargyri-each

      # An unmet peer range is the signal, not a nuisance: a major bump
      # hydrargyri-each has not widened for breaks every downstream install.
      - name: Install hydrargyri-each against this tree
        working-directory: hydrargyri-each
        run: |
          script/bootstrap
          npm install "$RUNNER_TEMP"/hydrargyri-*.tgz --no-save

      - name: Test hydrargyri-each
        working-directory: hydrargyri-each
        run: script/test
